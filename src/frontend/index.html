<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Scientific RAG Lab</title>

  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">Scientific RAG Lab</p>
      <h1>Chat with your scientific PDFs</h1>
      <p class="subtitle">
        Upload a paper, ingest it into Qdrant, and ask questions using local Ollama models.
      </p>
    </section>

    <section class="layout">
      <aside class="card upload-panel">
        <h2>Upload PDF</h2>

        <form id="upload-form" class="upload-form">
          <label for="pdf-file" class="dropzone" id="dropzone">
            <span class="dropzone-icon">📄</span>
            <span class="dropzone-title">Choose a PDF</span>
            <span class="dropzone-subtitle">or drag and drop it here</span>
            <input type="file" id="pdf-file" accept="application/pdf" required />
          </label>

          <div id="file-info" class="file-info hidden"></div>

          <button type="submit" id="upload-button">
            Upload and ingest
          </button>
        </form>

        <pre id="upload-output" class="output">No document uploaded yet.</pre>
      </aside>

      <section class="card chat-panel">
        <div class="chat-header">
          <h2>Chat</h2>
          <p>Ask questions about the uploaded documents.</p>
        </div>

        <div id="chat-messages" class="chat-messages">
          <div class="message assistant">
            Upload a PDF and ask me something about it.
          </div>
        </div>

        <form id="chat-form" class="chat-form">
          <input
            type="text"
            id="chat-input"
            placeholder="Ask about the paper..."
            autocomplete="off"
            required
          />
          <button type="submit" id="chat-button">Send</button>
        </form>
      </section>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
